# Settings for an ASRock Rack board (measured on a TRX40D8-2N2T, BMC fw 1.30).
# This is the configuration this project was built against, and the default.
# Saved changes are picked up automatically on the next check (no restart needed).
# If the file has an error, the service logs it and keeps the last good settings:
#   sudo journalctl -fu gpu-fan-control

# How the duty reaches the fan. "asrock" is the default, so leaving this out is the same.
backend = "asrock"

# BMC fan header to drive (1-6). Unlike a Supermicro BMC, an ASRock Rack one sets the mode
# and duty per header, so every other header stays on the BMC's own Default curve.
fan = 2

# Which tachometer to watch for a stalled fan. Empty means FAN2_1 here: this BMC names the
# main tach of header FANn "FANn_1", and the second rotor of a dual-rotor fan "FANn_2".
tach = []

# The lowest duty the BMC accepts: it rejects a manual duty under 20 % with rsp=0xcc.
min_duty = 20

# Seconds between GPU temperature checks.
interval = 5

# Duty (%) used when the GPU temperature can't be read.
failsafe_duty = 100

# Fan curve: [GPU temp in C, duty in %] points, linearly interpolated between them.
# Below the first point uses its duty; above the last point uses its duty.
# The BMC accepts 20..100 %; values outside that are clamped.
# Measured on this FAN2 fan: 20% ~1600 RPM, 30% ~1800, 50% ~3400, 65% ~5000, 96% ~8500.
# Full load (~250 W) settled at 76-77 C with this curve.
curve = [
  [40, 20],
  [50, 30],
  [60, 45],
  [70, 70],
  [78, 100],
]

# Ramp-down after load drops (ramp-up is always immediate):
# keep the current duty this many seconds after the GPU cools, to clear residual heat...
hold_secs = 60
# ...treating demand within this many % of the current duty as still loaded (temp jitter)...
hold_band = 10
# ...then lower the duty by at most this many % per check.
step_down = 2

# Fan failure detection: if the fan's tach (FANn_1) reads below this many RPM for 3 checks
# while it's being driven, log a FAN FAULT (journalctl -p crit) and hold the fan at 100 %
# until it reads OK again. 0 turns it off. This fan does ~1600 RPM at 20 %.
fan_min_rpm = 300
